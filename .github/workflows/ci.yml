name: CI

on:
  push:
    branches:
      - cursor/scaffold-monorepo-6ea7
  pull_request:
    branches:
      - cursor/scaffold-monorepo-6ea7
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: property_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d property_control"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      OCR_STUB_ENABLED: ""
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/property_control
      AVISO_VERSION: "2026-10-21"
      AVISO_URL: "https://example.com/aviso"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm api:typecheck
      - name: Generate the boot secret and app-role password
        run: |
          secret=$(openssl rand -base64 32 | tr -d '\n')
          password=$(openssl rand -hex 24)
          echo "::add-mask::$secret"
          echo "::add-mask::$password"
          echo "SERVER_SECRET=$secret" >> "$GITHUB_ENV"
          echo "APP_ROLE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Create the non-owner app role
        run: bash apps/api/prisma/bootstrap-app-role.sh
      - name: Migrate as the database owner
        run: pnpm --filter @property-control/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/property_control
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/property_control
      - name: Test as the app role
        run: pnpm api:test
        env:
          DATABASE_URL: postgresql://property_control_app:${{ env.APP_ROLE_PASSWORD }}@localhost:5432/property_control
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/property_control
      - run: pnpm api:build
      - run: pnpm mobile:typecheck
      - run: pnpm mobile:test
